name: Snake

on:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Lntano-S
          outputs: |
            dist/github-snake.svg?color_snake=2E425A&color_dots=EBEDF0,C8E2F4,93C4E6,5E9FD0,2E5F87
            dist/github-snake-dark.svg?color_snake=C7E6FA&color_dots=3E5266,4E7BA8,5E9FD0,78B8E4,9FD2F0

      # snk 把颜色写成 CSS 变量（fill:var(--ce)），不认变量的渲染器会让 fill 退回黑色，
      # 整张图变黑。这一步把它们写死成色值。逻辑在仓库里的脚本，免得在 YAML 里塞 heredoc。
      - name: Inline the CSS variables
        run: |
          python3 -V
          python3 tools/inline_svg_vars.py dist
          grep -o 'fill:[^;}]*' dist/github-snake-dark.svg | head -3
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
