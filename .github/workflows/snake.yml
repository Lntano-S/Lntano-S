name: generate snake animation

# 照搬 yuki4266 的写法，只把配色换成蓝色系
on:
  # refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # allow manual trigger from the Actions tab
  workflow_dispatch:
  # also run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2E5F87&color_dots=#EBEDF0,#C8E2F4,#93C4E6,#5E9FD0,#2E5F87
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9FD2F0&color_dots=#1E2A36,#26435F,#33628F,#4B9FD6,#85BEE6

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
