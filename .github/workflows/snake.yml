name: Snake

on:
  schedule:
    - cron: "0 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Lntano-S
          outputs: |
            dist/github-snake.svg?color_snake=2E425A&color_dots=EBEDF0,C8E2F4,93C4E6,5E9FD0,2E5F87
            dist/github-snake-dark.svg?color_snake=C7E6FA&color_dots=3E5266,4E7BA8,5E9FD0,78B8E4,9FD2F0

      # snk 输出的颜色写成 CSS 变量（fill:var(--ce)），有些浏览器 / 预览器不认，
      # 变量不生效时 fill 退回黑色，整张图就是全黑。这里直接写死成色值。
      - name: Inline the CSS variables
        run: |
          python3 - <<'PY'
          import pathlib, re

          for path in pathlib.Path("dist").glob("*.svg"):
              text = path.read_text(encoding="utf-8")
              for key, value in re.findall(r"--([a-z0-9]+):([^;}]+)", text):
                  text = text.replace(f"var(--{key})", value)
              path.write_text(text, encoding="utf-8")
              print(path.name, "变量已写死")
          PY

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
